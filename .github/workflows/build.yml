name: build-check

# 只做「代码能不能编过」的校验，**不保留任何产物**：
#   · 不往仓库里提交 dylib / 日志
#   · 不上传 Actions artifact
# 成品一律在本地产（bash scripts/build_ios_local.sh）。
#
# 想彻底不跑 CI 的话，把这个文件和 preview.yml 一起删掉即可。

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          echo "runner: $(sw_vers -productVersion 2>/dev/null || echo ?)"
          xcodebuild -version 2>&1 || true
          echo "sdk: $(xcrun --sdk iphoneos --show-sdk-path 2>&1 || true)"

      - name: 拉依赖 + 编译（编不过就让这个 job 红）
        run: |
          bash scripts/fetch_deps.sh
          make generic
          ls -l build/TerrariaModMenu.dylib

      # 日志只放进 run 页面的 Summary，不落盘、不提交
      - name: 结果
        if: always()
        run: |
          {
            echo "## 编译校验"
            echo ""
            echo '```'
            if [ -f build/TerrariaModMenu.dylib ]; then
              echo "✅ 编译通过（产物留在 runner 上，不回传仓库）"
            else
              echo "❌ 编译失败"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
