name: preview-check

# UI 代码的编译校验（Windows / MSVC 这条路，Mac 上验不了）。
# 同样**不保留产物**：编出来的 exe 只留在 runner 上，不回仓库、不上传 artifact。
#
# 本机想直接跑预览器用 macOS 那份：
#   bash scripts/build_preview_mac.sh && ./build/TerrariaModMenu-Preview-mac

on:
  push:
    paths:
      - 'src/ui/**'
      - 'preview/**'
      - 'third_party/**'
      - '.github/workflows/preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 拉 imgui
        shell: bash
        run: |
          if [ ! -d third_party/imgui/.git ]; then
            git clone --depth 1 --branch v1.90.9 https://github.com/ocornut/imgui.git third_party/imgui
          fi

      - uses: ilammy/msvc-dev-cmd@v1

      - name: 编译预览器（只校验，产物不回传）
        shell: cmd
        run: |
          mkdir build 2>nul
          cl /nologo /std:c++17 /utf-8 /EHsc /O2 /MD /DNDEBUG /DMODMENU_PREVIEW ^
             /Ithird_party\imgui /Ithird_party\imgui\backends /Isrc /Isrc\ui ^
             /TP ^
             preview\main.cpp src\ui\menu.mm src\ui\cheat_ui.mm ^
             third_party\imgui\imgui.cpp third_party\imgui\imgui_draw.cpp ^
             third_party\imgui\imgui_tables.cpp third_party\imgui\imgui_widgets.cpp ^
             third_party\imgui\backends\imgui_impl_win32.cpp ^
             third_party\imgui\backends\imgui_impl_dx11.cpp ^
             /Fe:build\TerrariaModMenu-Preview.exe ^
             /link d3d11.lib dxgi.lib d3dcompiler.lib user32.lib gdi32.lib shell32.lib
          if not exist build\TerrariaModMenu-Preview.exe exit /b 1

      - name: 结果
        if: always()
        shell: bash
        run: |
          {
            echo "## 预览器编译校验"
            echo ""
            if [ -f build/TerrariaModMenu-Preview.exe ]; then
              echo "✅ 编译通过（产物留在 runner 上，不回传仓库）"
            else
              echo "❌ 编译失败"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
