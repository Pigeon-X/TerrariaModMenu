name: preview

on:
  push:
    paths:
      - 'src/ui/**'
      - 'preview/**'
      - '.github/workflows/preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 拉 imgui
        shell: bash
        run: |
          if [ ! -d third_party/imgui/.git ]; then
            git clone --depth 1 --branch v1.90.9 https://github.com/ocornut/imgui.git third_party/imgui
          fi

      - uses: ilammy/msvc-dev-cmd@v1

      - name: 编译预览器
        shell: cmd
        run: |
          mkdir dist 2>nul
          cl /nologo /std:c++17 /EHsc /O2 /MD /DNDEBUG /DMODMENU_PREVIEW ^
             /Ithird_party\imgui /Ithird_party\imgui\backends /Isrc /Isrc\ui ^
             /TP ^
             preview\main.cpp src\ui\menu.mm ^
             third_party\imgui\imgui.cpp third_party\imgui\imgui_draw.cpp ^
             third_party\imgui\imgui_tables.cpp third_party\imgui\imgui_widgets.cpp ^
             third_party\imgui\backends\imgui_impl_win32.cpp ^
             third_party\imgui\backends\imgui_impl_dx11.cpp ^
             /Fe:dist\TerrariaModMenu-Preview.exe ^
             /link d3d11.lib dxgi.lib d3dcompiler.lib user32.lib gdi32.lib shell32.lib > preview_build.log 2>&1
          type preview_build.log
          if not exist dist\TerrariaModMenu-Preview.exe exit /b 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TerrariaModMenu-Preview
          path: |
            dist/TerrariaModMenu-Preview.exe
            preview_build.log
          if-no-files-found: warn

      - name: 回传 exe 到 dist/
        if: always()
        shell: bash
        run: |
          mkdir -p dist
          cp preview_build.log dist/preview_build.log 2>/dev/null || true
          git config user.name "modmenu-ci"
          git config user.email "modmenu-ci@local"
          git add -f dist/ || true
          if git diff --cached --quiet; then echo "无变化"; else
            git commit -m "ci: 更新预览器 [skip ci]"
            git pull --rebase origin main || true
            git push || (git pull --rebase origin main && git push)
          fi
